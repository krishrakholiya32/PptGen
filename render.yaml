# Render Blueprint for PptGen backend
# Docs: https://render.com/docs/blueprint-spec
#
# After pushing this file, go to Render → "New +" → "Blueprint", connect this
# repo, and Render reads this automatically. You'll be prompted to fill in the
# secret API keys marked `sync: false` below (they are NOT stored in git).

services:
  - type: web
    name: pptgen-backend
    runtime: docker
    repo: https://github.com/krishrakholiya32/PptGen
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # ── Required secrets — fill these in the Render dashboard ──
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      # ── Non-secret config ──
      - key: ENVIRONMENT
        value: production
      - key: GROQ_TEXT_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_VISION_MODEL
        value: meta-llama/llama-4-scout-17b-16e-instruct
      - key: UPLOAD_DIR
        value: uploads
      - key: OUTPUT_DIR
        value: outputs
      - key: MAX_UPLOAD_SIZE_MB
        value: "20"
      - key: CORS_ORIGINS
        value: '["https://kpptgen.netlify.app","https://pptgen.zrik.tech","http://localhost:5173"]'
